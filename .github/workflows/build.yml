name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  # Versão com o banco v1 (a primeira publicada) — usada para testar a migração.
  OLD_SHA: a3a1003e2f8264e99f8cf97eab38db853e4394ae
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: new
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  build-old:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.OLD_SHA }}" }
      - uses: actions/checkout@v4
        with: { path: current }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar versão antiga com a mesma chave
        run: |
          cat >> app/build.gradle.kts <<'KTS'
          android { signingConfigs { getByName("debug") { storeFile = rootProject.file("current/ci/debug.keystore"); storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android" } } }
          KTS
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: old, path: app/build/outputs/apk/debug/app-debug.apk }

  emulator:
    needs: [build, build-old]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: new, path: new-raw }
      - uses: actions/download-artifact@v4
        with: { name: old, path: old }
      - name: Organizar APKs
        run: |
          mkdir -p new
          find new-raw -name '*.apk' -exec cp {} new/ \;
          ls -R new old
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator.sh
      - name: Publicar prints num branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cp instrument.txt crash.txt shots/ 2>/dev/null || true
          cd shots
          git init -q -b shots-${{ matrix.api }}
          git config user.name "casaclara-ci"; git config user.email "ci@casaclara.invalid"
          git add -A && git commit -qm "Prints API ${{ matrix.api }} - ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-${{ matrix.api }}

  release:
    needs: [emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: new, path: new-raw }
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp $(find new-raw -name app-debug.apk) CasaClara.apk
          gh release delete apk --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create apk CasaClara.apk -R ${{ github.repository }} --title "Casa Clara — APK de teste" --notes "APK de teste gerado automaticamente e testado em emulador (Android 8 e 14). Baixe no celular e instale (permita instalar apps desconhecidos)." --target "$GITHUB_SHA"
