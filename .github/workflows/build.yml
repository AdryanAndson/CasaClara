name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar e testar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: casa-clara-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK para download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CasaClara.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk CasaClara.apk --title "Casa Clara — APK de teste" --notes "APK de teste (debug) gerado automaticamente a partir do último commit. Baixe no celular e instale (permita instalar apps desconhecidos)." --target "$GITHUB_SHA"
